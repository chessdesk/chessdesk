[workspace]
members = ["crates/*"]
default-members = ["crates/chessdesk"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Moritz Maibaum"]
publish = false

# Cargo.lock holds libc at 0.2.189: gpui's xattr 0.2 uses libc::ENOATTR on Linux, which 0.2.190
# dropped. Keep it there in `cargo update` until gpui moves on.
[workspace.dependencies]
chessdesk-core = { path = "crates/chessdesk-core" }
chessdesk-players = { path = "crates/chessdesk-players" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
shakmaty = "0.30"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow" # panes and menus are mostly switches
unreadable_literal = "allow" # hex colours read better unseparated

[profile.release]
panic = "abort"
strip = true

# What the release workflow ships: slower to build, smaller and faster to run.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
