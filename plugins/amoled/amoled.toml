# AMOLED Black: Chessdesk's dark theme on true black, so an OLED screen lights only what's drawn.
background = "#000000"
accent = "#1a1f1f"
popover = "#0a0d0d"
popover_border = "#1f2626"
text = "#d6e0dd"
muted = "#6b7f7d"
icon = "#56726f"
caret = "#7fd4c8"
callout = "#e8a05c"
keyword = "#86cfc3"
string = "#b6cb92"
comment = "#6b7f7d"
function = "#95bfdc"
type = "#d9c08e"
number = "#dfa58d"
constant = "#dfa58d"
# The dark theme's board: one made from this accent would be too dark for black pieces.
board_light = "#4b5c5b"
board_dark = "#243232"
# Terminal: black, red, green, yellow, blue, magenta, cyan, white, then the bright ones.
ansi = [
    "#000000", "#df8a8a", "#a9c48a", "#d9c08e", "#8fb4d9", "#c0a2d6", "#7fd4c8", "#c5d0cd",
    "#56726f", "#eca0a0", "#bcd8a0", "#e8d2a4", "#a8c8e8", "#d2b8e4", "#9ce4da", "#e8efec",
]
