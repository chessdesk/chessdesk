# What `cargo deny check` holds every dependency to: `just deny` runs it.
#:schema https://raw.githubusercontent.com/EmbarkStudios/cargo-deny/main/deny.schema.json

[advisories]
# Unmaintained notices count for Chessdesk's own dependencies. Those deep inside gpui are
# gpui's to replace and can't be fixed from here.
unmaintained = "workspace"

[licenses]
# Chessdesk is GPL 3.0 or later, so anything compatible with that may come in.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots, the certificates for downloads
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Chessdesk's own crates are not published.
ignore = true

[bans]
# gpui alone brings several versions of some crates.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
