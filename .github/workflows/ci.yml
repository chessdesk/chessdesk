name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debugger here: smaller caches and faster links.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows is checked locally: the pre-push hook runs clippy and the tests.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev
      # Installs the toolchain rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Branches read main's cache; only main writes it, so they don't crowd it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Every push to main builds the release; a new version in Cargo.toml publishes it.
  release:
    needs: [check, deny]
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
