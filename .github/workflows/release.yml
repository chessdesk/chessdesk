# Builds Chessdesk for Windows, macOS and Linux, starts the macOS and Linux builds on their own
# systems, and publishes them as a release. CI calls this after its checks pass on main, and it
# only builds when the version in Cargo.toml has no release yet. Run it by hand on any branch to
# try the builds without publishing.
name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! gh release view "v$version" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is out already: bump the version in Cargo.toml for a new release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x86_64 }
          - { runner: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # ring needs LLVM's clang on ARM64; the one from Visual Studio won't do.
      - if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          if (-not (Test-Path $clang)) { choco install llvm -y --no-progress }
          "CC_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked
      - shell: pwsh
        run: Compress-Archive -Path target/dist/chessdesk.exe, LICENSE -DestinationPath chessdesk-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: chessdesk-windows-${{ matrix.arch }}
          path: chessdesk-windows-${{ matrix.arch }}.zip

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bundle a universal Chessdesk.app
        run: |
          version=${{ needs.version.outputs.version }}
          contents=Chessdesk.app/Contents
          mkdir -p "$contents/MacOS" "$contents/Resources" AppIcon.iconset
          lipo -create -output "$contents/MacOS/chessdesk" \
            target/aarch64-apple-darwin/dist/chessdesk target/x86_64-apple-darwin/dist/chessdesk
          sed "s/VERSION/$version/" packaging/macos/Info.plist > "$contents/Info.plist"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/macos/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/macos/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$contents/Resources/AppIcon.icns"
          # Ad-hoc signed, as Apple Silicon runs nothing unsigned. Not notarised: Gatekeeper still asks.
          codesign --force --sign - Chessdesk.app
          ditto -c -k --keepParent Chessdesk.app chessdesk-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: chessdesk-macos
          path: chessdesk-macos.zip

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on any glibc since.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked
      - run: |
          dir=chessdesk-linux-${{ matrix.arch }}
          mkdir "$dir"
          cp target/dist/chessdesk LICENSE packaging/linux/chessdesk.desktop "$dir/"
          cp crates/chessdesk/assets/app_icon.svg "$dir/chessdesk.svg"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: chessdesk-linux-${{ matrix.arch }}
          path: chessdesk-linux-${{ matrix.arch }}.tar.gz

  smoke-macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: chessdesk-macos
      - run: ditto -x -k chessdesk-macos.zip .
      - run: bash .github/smoke-test.sh Chessdesk.app/Contents/MacOS/chessdesk screenshot.png
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: screenshot-${{ matrix.runner }}
          path: screenshot.png
          if-no-files-found: ignore

  smoke-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # A plain desktop install, plus Xvfb as the screen, Openbox as the window manager and
      # lavapipe as a software GPU.
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox imagemagick mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libx11-xcb1 libxcb1 libwayland-client0 libfontconfig1 libasound2t64
      - uses: actions/download-artifact@v5
        with:
          name: chessdesk-linux-${{ matrix.arch }}
      - run: tar xzf chessdesk-linux-${{ matrix.arch }}.tar.gz
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" bash .github/smoke-test.sh chessdesk-linux-${{ matrix.arch }}/chessdesk screenshot.png
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          retention-days: 7
          name: screenshot-linux-${{ matrix.arch }}
          path: screenshot.png
          if-no-files-found: ignore

  publish:
    needs: [version, windows, smoke-macos, smoke-linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: chessdesk-*
          merge-multiple: true
      - name: Publish, unless this version is out already
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${{ needs.version.outputs.version }}
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is out already."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "Chessdesk $version" \
            --generate-notes chessdesk-*.zip chessdesk-*.tar.gz
